<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body{margin:0;background:#0b0e13;color:#e8edf5;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
      font-size:17px}
    a{color:#5ac8fa} a:hover{color:#8ad9fc}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  </style>
</helmet>

<!-- VERWORFEN. Der allererste Entwurf in Systemblau, bevor über Design
     gesprochen wurde. Funktional richtig (Freigabe dominiert, große
     Trefferflächen), aber austauschbar - genau das war der Anlass für die
     eigene Farbwelt. Bleibt als Vergleichspunkt stehen. -->

<div style="width:390px;height:844px;display:flex;flex-direction:column;background:#0b0e13">

  <!-- Kopf -->
  <div style="display:flex;align-items:center;gap:10px;padding:12px 16px;background:#151a22;
    border-bottom:1px solid #2a3442;flex:none">
    <button style="padding:8px 11px;border-radius:10px;background:#1c2330;border:1px solid #2a3442;
      color:#e8edf5;font-size:14px;font-family:inherit">‹</button>
    <span style="width:10px;height:10px;border-radius:50%;background:#fbbf24;flex:none"></span>
    <div style="flex:1;min-width:0">
      <div style="font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;
        white-space:nowrap">Dienste-Dashboard bauen</div>
      <div style="font-size:12.5px;color:#93a1b5">Alles fragen</div>
    </div>
    <div style="font-size:12.5px;color:#93a1b5;flex:none">5h 27%</div>
  </div>

  <!-- Verlauf -->
  <div style="flex:1;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:9px">

    <div style="background:#17293d;border:1px solid #2b4059;border-radius:14px;padding:13px 15px;
      margin-left:28px">
      <div style="line-height:1.5">Bau das Dashboard und zeig mir, was gerade läuft.</div>
    </div>

    <div style="background:#151a22;border:1px solid #2a3442;border-radius:14px;padding:12px 15px">
      <div style="font-weight:600;color:#5ac8fa">Read</div>
      <div class="mono" style="font-size:13.5px;color:#93a1b5;margin-top:3px">bridge/heartbeat.py</div>
    </div>

    <div style="background:#1c2330;border:1px solid #2f3d52;border-radius:14px;padding:13px 15px">
      <div style="line-height:1.5">Die Registry steht. Jetzt lege ich die Ansicht an —
        dafür muss ich eine Datei schreiben.</div>
    </div>

    <!-- Die Bestätigung dominiert den Bildschirm -->
    <div style="background:#2a2413;border:2px solid #fbbf24;border-radius:14px;padding:14px 15px;
      display:flex;flex-direction:column;gap:12px">
      <div>
        <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#5d6b7f">Bestätigung nötig</div>
        <div style="font-size:18px;font-weight:700;color:#fbbf24;margin-top:5px">Write</div>
        <div class="mono" style="font-size:14px;color:#e8edf5;margin-top:6px;
          word-break:break-all;line-height:1.4">web/dashboard.js</div>
      </div>
      <div style="display:flex;gap:10px">
        <button style="flex:1;padding:15px;border-radius:12px;font-size:17px;font-weight:650;
          background:#1c2330;border:1px solid #2a3442;color:#e8edf5;font-family:inherit">Ablehnen</button>
        <button style="flex:1;padding:15px;border-radius:12px;font-size:17px;font-weight:650;
          background:#4ade80;border:none;color:#06240f;font-family:inherit">Erlauben</button>
      </div>
    </div>

  </div>

  <!-- Eingabe -->
  <div style="display:flex;gap:8px;align-items:flex-end;padding:10px 16px 22px;background:#151a22;
    border-top:1px solid #2a3442;flex:none">
    <button style="width:46px;height:46px;border-radius:12px;background:#1c2330;
      border:1px solid #2a3442;color:#e8edf5;font-size:17px;flex:none;font-family:inherit">☰</button>
    <div style="flex:1;background:#1c2330;border:1px solid #2a3442;border-radius:12px;
      padding:13px 14px;color:#5d6b7f;min-height:46px;box-sizing:border-box">Auftrag …</div>
    <button style="width:46px;height:46px;border-radius:12px;background:#1c2330;
      border:1px solid #2a3442;flex:none;display:grid;place-items:center;font-family:inherit">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#e8edf5" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
    </button>
    <button style="width:46px;height:46px;border-radius:12px;background:#5ac8fa;border:none;
      flex:none;display:grid;place-items:center;font-family:inherit">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#04222e" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
